name: Deploy Nammatham Site

on:
  push:
    branches:
      - main
    paths:
      - 'apps/nammatham/**'
      - '.github/workflows/deploy-nammatham.yml'
  # pull_request:
  #   types: [opened, synchronize, reopened, closed]
  #   branches:
  #     - main
env:
  pnpm_version: 8
  node_version: 20

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        name: Install pnpm
        with:
          version: ${{ env.pnpm_version }}

      - name: Use Node.js ${{ env.node_version }}
        uses: actions/setup-node@v4
        with:
          cache: 'pnpm'
          node-version: ${{ env.node_version }}


      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm exec nx run nammatham:build

      - name: Deploy
        run: pnpm exec nx run nammatham:deploy
        env:
          SWA_CLI_DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_RED_RIVER_09AD3DC00 }}


